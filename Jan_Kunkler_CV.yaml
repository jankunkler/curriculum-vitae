cv:
  name: Dr. Jan Kunkler
  location: Straubing, Germany
  email: mail@jankunkler.de
  phone: "+49016095131829"
  # website: https://www.jankunkler.de  # Commented out - add back when website is live
  social_networks:
    - network: LinkedIn
      username: jankunkler
    # - network: GitHub  # Commented out - not representative (working on internal repos)
    #   username: jankunkler
  sections:
    summary:
      - "Builder and leader for 0-to-1 applied AI products in supply chain and logistics, at the intersection of business and technology. Took two AI products from idea to customers at Lobster: Pathfinder (in production) and UDP (in design-partner rollout). Owned the full span, from strategy, requirements, design drafts and customer discussions to architecture and full-stack engineering, then enabled a team to take the work over. Start from what the technology can actually do, beneath the headlines, and use supply chain domain knowledge to decide where AI creates value. Lead through empowerment and inspiration, not hierarchy; grew Lobster's AI team from zero to seven. Business and supply chain education, PhD in data science applied to logistics; author of Agentic AI (Springer Vieweg, December 2026)."

    experience:
      - company: Lobster
        position: Principal AI Engineer & Engineering Manager
        date:
        start_date: 2025-03
        end_date: present
        location: Tutzing, DE
        summary: "Dual role: built and led Team Caprica, Lobster's AI engineering team, while owning AI strategy, architecture and technical roadmap."
        highlights:
          - "**Pathfinder:** architected from scratch an agentic AI copilot running in production as cloud-native microservices on AWS, integrated into the Lobster Data Platform and serving 2000+ companies (incl. HARIBO, Hermes, HP, Coop, Lindt & Sprüngli, Logwin)"
          - "**Pathfinder security:** defined goal, architecture and security concept of the MCP gateway, a federated proxy that gives Pathfinder access to only specific tools of individual customer instances, cloud or on-prem; coordinated its implementation with the platform team. Pathfinder acts strictly with the user's permissions and writes only after explicit confirmation"
          - "**Pathfinder features:** Automapping (project MAPS), AI-generated mappings between message formats such as EDIFACT and IDoc, delivered in 2.5 months against an estimate of 6–12 months. Orchestration that creates integration jobs, portals and custom type definitions from what users describe, turning weeks of configuration into minutes of review for low-tech and no-tech customers. Shaped the UX with the design team"
          - "**UDP:** built a service for extracting structured data from business documents from scratch in 3 months against an estimate of 9–12 months. Sole full-stack engineer, from backend to Angular frontend, directing AI coding agents while owning architecture, code review and coordination with infrastructure, legal and other teams"
          - "**UDP go-to-market:** led the design-partner program (customer selection, pain-point discovery, workshops, demos), taking UDP to its first design-partner go-live. Covered product management, design and engineering management; onboarded engineers to take it over"
          - "**Team:** grew the AI function from one person to a team of seven; defined team charter, career levels and Senior/Staff AI Engineer tracks; designed the hiring process"
          - "**Strategy:** shaped the AI narrative for the board with the CTO, including much of the slide material now used company-wide, backed by data on cost and quality of strategic options; owned the AI technical roadmap"
          - "**M&A:** led technical due diligence on potential partners and acquisition targets in supply chain AI, reviewing technical setup, architecture, code and roadmap"
          - "**Semantic layer:** designed the ontology-based semantic layer (RDF/OWL, SHACL) for cross-format data integration; partially built and a core part of the product strategy for supply chain intelligence"

      - company: Lobster
        position: Principal Data Scientist
        date:
        start_date: 2024-05
        end_date: 2025-02
        location: Tutzing, DE
        summary: First AI practitioner at Lobster.
        highlights:
          - Developed the company-wide AI strategy with C-level management
          - Evaluated frameworks, models and infrastructure and set the technical foundation for production AI
          - Built initial POCs for documentation generation, data mapping, classification and semantic knowledge retrieval

      - company: OTH Regensburg
        position: Visiting Lecturer
        date:
        start_date: 2024-10
        end_date: present
        location: Regensburg, DE
        summary: Programming and AI fundamentals for Digital Business Management students.

      - company: Lobster Logistics Cloud
        position: Digital Solutions Manager
        date:
        start_date: 2023-10
        end_date: 2024-05
        location: Tutzing, DE
        summary: Managed EDI and collaboration network (Lobster subsidiary, now Lobster Data Network).
        highlights:
          - Built the Customer Success team from scratch (5 people)
          - Managed custom integration projects for shippers, forwarders, carriers and customs agencies; sales engineering and backend architecture consulting

      - company: University of Regensburg
        position: Postdoctoral Research Associate
        date:
        start_date: 2023-03
        end_date: 2023-09
        location: Regensburg, DE
        highlights:
          - Interim Chair for Controlling and Logistics; led M.Sc./B.Sc. programs with 250+ students

      - company: Freelance
        position: Data Science Consultant
        date:
        start_date: 2021-01
        end_date: 2023-10
        location: Regensburg, DE
        highlights:
          - Freight tariff development for six German transportation service providers

      - company: Braun & Kunkler GbR
        position: Co-Founder & Technical Lead
        date:
        start_date: 2020-01
        end_date: 2022-04
        location: Burglengenfeld, DE
        highlights:
          - Built the RESET app for student self-regulation, including ML model integration

      - company: University of Regensburg
        position: Research Fellow
        date:
        start_date: 2019-09
        end_date: 2023-03
        location: Regensburg, DE
        highlights:
